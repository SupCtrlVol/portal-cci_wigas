<!CtrlVol html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Portal Ejecutivo Wigas</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <!-- Página de inicio -->
  <div id="inicio" class="inicio">
    <img src="log.png" alt="Logo Wigas" class="logo-grande" onclick="entrarPortal()">
    <h1>Portal Ejecutivo Wigas</h1>
    <p>Haz clic en el logo para entrar al Balance de Energía</p>
  </div>

  <!-- Balance de Energía (oculto al inicio) -->
  <div id="balance" class="main" style="display:none;">
    <!-- Sidebar -->
    <div class="sidebar">
      <h5>Balance de Energía</h5>
      <a href="#" onclick="mostrarReporte('ecatepec')">13 GAS</a>
      <a href="#" onclick="mostrarReporte('bexica')">Bexica</a>
      <h5>CONSORCIO DE GNV</h5>
      <a href="#" onclick="mostrarReporte('coacalco')">Coacalco</a>
      <a href="#" onclick="mostrarReporte('ecatepecII')">Ecatepec II</a>
      <a href="#" onclick="mostrarReporte('tlanepantla')">Tlanepantla</a>
      <h5>LANDSEGEN</h5>
      <a href="#" onclick="mostrarReporte('lr_almacenamiento')">Modelo de Almacenamiento</a>
      <h5>WIGAS</h5>
      <a href="#" onclick="mostrarReporte('naucalpan')">WIGAS</a>
    </div>

    <!-- Contenedor central -->
    <main id="contenedor" class="dashboard">
      <div class="card p-3">
        <h2>Bienvenido al Balance de Energía</h2>
        <p>Selecciona un reporte en el menú lateral.</p>
      </div>
    </main>
  </div>

  <script src="assets/js/main.js"></script>
</body>
</html>
